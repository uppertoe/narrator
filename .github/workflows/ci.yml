name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild so base-image security fixes are picked up even when no
    # code changes; the digest pin on the server repo follows.
    - cron: "40 17 * * 0" # Sun 17:40 UTC (Mon 03:40 AEST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  publish:
    # Build and push the image on pushes to main and on version tags.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/narrator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      # Build once and LOAD into the runner's docker: the image must boot and
      # serve /healthz before anything is pushed (unit tests can pass while
      # the packaged image is broken).
      - name: Build image (load for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: narrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — image boots and serves /healthz
        run: |
          set -e
          docker run -d --name narrator-smoke -p 8899:8000 -e DOMAIN=example.com -e NARRATOR_DATABASE_URL=sqlite:////tmp/narrator.db narrator:ci
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8899/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "GET /healthz -> $code (after ${i}s)"
          docker logs narrator-smoke || true
          docker rm -f narrator-smoke >/dev/null 2>&1 || true
          if [ "$code" != "200" ]; then
            echo "::error::boot smoke failed — image does not serve /healthz"
            exit 1
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # amd64 only: the image bakes the Whisper model, and building arm64 under
          # QEMU emulation is very slow. Add linux/arm64 (+ docker/setup-qemu-action)
          # if you deploy on an arm64 VPS.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
